; TDOA tracker: separate PlatformIO project. Build/flash from the repo root with
;   ~/.platformio/penv/bin/pio run -d tdoa -e tdoa -t upload
; Waveshare ESP32-S3-Zero (4 MB flash), Arduino framework.

[platformio]
default_envs = tdoa

[env]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 4MB
board_build.partitions = default.csv
monitor_speed = 115200
; Serial = native USB (USB-Serial-JTAG)
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
; main.cpp and gimbal.cpp are separate programs: each env builds one
build_src_filter = +<*> -<gimbal.cpp>

; The tracker
[env:tdoa]

; Clock-sync test: bus B (I2S1) reads bus A's data line, so both buses must give identical samples.
; Also forces a re-sync every 2 s to prove re-syncing keeps alignment. Check with host/synccheck.py
[env:tdoa_synctest]
build_flags =
    ${env.build_flags}
    -DSYNC_TEST

; Wiring check: tracker with GPIO4 (bus B data) pulled up. Bus B reading all -1 = nothing drives the line
; (open SD wire, or mics 3/4 unclocked or unpowered); still 0 = something holds it low. Check with scope.py
[env:tdoa_sdpullup]
build_flags =
    ${env.build_flags}
    -DSD_PULLUP

; Algorithm test: mics replaced by a synthetic plane-wave tone from a known, slowly rotating direction
; (truth sent in the packet). Check with host/simcheck.py
[env:tdoa_sim]
build_flags =
    ${env.build_flags}
    -DTDOA_SIM

; As tdoa_sim, plus a fake reflection null on mic 2 for 0.3 s every 5 s (exercises the tracker's gates).
; Check with host/trackcheck.py
[env:tdoa_simbad]
build_flags =
    ${env.build_flags}
    -DTDOA_SIM
    -DSIM_CORRUPT

; As tdoa_sim, plus per-stage timing (us) in tau[0..2]
[env:tdoa_timing]
build_flags =
    ${env.build_flags}
    -DTDOA_SIM
    -DTIMING

; Gimbal: the tracker driving the pan (GPIO10) and elevation (GPIO11) servos. Settings in src/gimbal_config.h.
;   pio run -d tdoa -e gimbal -t upload, then: cd tdoa/host && uv run python gimbal_view.py
[env:gimbal]
build_src_filter = +<*> -<main.cpp>

; Closed-loop gimbal simulation: scripted source, simulated array on the gimbal's true pose (servo pins never
; driven). Check with host/gimbal_simcheck.py
[env:gimbal_sim]
build_src_filter = +<*> -<main.cpp>
build_flags =
    ${env.build_flags}
    -DGIMBAL_SIM

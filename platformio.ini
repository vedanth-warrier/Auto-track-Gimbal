; Waveshare ESP32-S3-Zero (4 MB flash), Arduino framework.
; Each env builds one program from src/: `pio run -e mic -t upload`

[platformio]
default_envs = mic

[env]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 4MB
board_build.partitions = default.csv
monitor_speed = 115200
; Serial = native USB (USB-Serial-JTAG), no UART copy
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:mic]
build_src_filter = +<mic.cpp>

[env:servo]
build_src_filter = +<servo.cpp>

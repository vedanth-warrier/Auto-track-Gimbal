; Waveshare ESP32-S3-Zero (4 MB flash), Arduino framework.
; Each env builds one program from src/: `pio run -e mic -t upload`

[platformio]
default_envs = servo_ctl

[env]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 4MB
board_build.partitions = default.csv
monitor_speed = 115200
; Serial = native USB (USB-Serial-JTAG), no UART copy
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:mic]
build_src_filter = +<mic.cpp>

; Bench test: synthetic 7 kHz tone instead of the mics (mic 1 at 2x the others)
[env:mic_test]
build_src_filter = +<mic.cpp>
build_flags =
    ${env.build_flags}
    -DTEST_TONE=7000

; Bench timing: same, but amp[0..2] carry us per stage instead of amplitudes
[env:mic_timing]
build_src_filter = +<mic.cpp>
build_flags =
    ${env.build_flags}
    -DTEST_TONE=7000
    -DTIMING

; Servo oscillation test (no host needed): pio run -e servo -t upload
[env:servo]
build_src_filter = +<servo.cpp>
; DTR/RTS drive the S3's reset/boot lines over USB: keep them low or opening the monitor can reset the board
monitor_dtr = 0
monitor_rts = 0
monitor_echo = yes
monitor_eol = LF
monitor_filters = send_on_enter

; Servo controlled from the Mac: pio run -e servo_ctl -t upload, then uv run host/servo_gui.py
[env:servo_ctl]
build_src_filter = +<servo_ctl.cpp>
